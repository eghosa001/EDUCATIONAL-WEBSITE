name: Deploy GitHub Pages fallback

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-fallback
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate fallback application
        shell: bash
        run: |
          set -euo pipefail
          test -s pages/index.html
          test -s pages/app.js
          test -s pages/styles.css
          test -f pages/.nojekyll
          node --check pages/app.js
          grep -q 'THE GUIDE' pages/index.html
          grep -q 'createClient' pages/app.js
          grep -q 'signInWithPassword' pages/app.js
          grep -q "from('topics')" pages/app.js
          grep -q "from('lessons')" pages/app.js
          grep -q "from('questions')" pages/app.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload fallback app
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy fallback
        id: deployment
        uses: actions/deploy-pages@v4
