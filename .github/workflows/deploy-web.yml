name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'supabase/functions/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_NCVETs3OwQwsVNul4nJKcnIL
  VERCEL_PROJECT_ID: prj_V4ogfcOg1QSGDjbE9PW6KLJcB66R

jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and repository tests
        run: npm test

      - name: Production build
        run: npm run build

  deploy:
    name: Deploy production
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Require Vercel deployment token
        if: env.VERCEL_TOKEN == ''
        run: |
          echo 'GitHub secret deploy is not configured or is unavailable to this workflow.'
          echo 'Add the Vercel access token as an Actions secret named deploy, then re-run this workflow.'
          exit 1

      - name: Install Vercel CLI
        if: env.VERCEL_TOKEN != ''
        run: npm install --global vercel@latest

      - name: Deploy production on Vercel
        id: deploy
        if: env.VERCEL_TOKEN != ''
        shell: bash
        run: |
          set -o pipefail
          url=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" --cwd=web 2>&1 | tee /tmp/vercel-deploy.log | tail -n 1)
          if [[ ! "$url" =~ ^https:// ]]; then
            echo 'Vercel did not return a deployment URL.'
            cat /tmp/vercel-deploy.log
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      - name: Smoke test deployment
        if: env.VERCEL_TOKEN != '' && steps.deploy.outputs.url != ''
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 5 "${{ steps.deploy.outputs.url }}/" > /dev/null
          curl --fail --silent --show-error --retry 8 --retry-delay 5 "${{ steps.deploy.outputs.url }}/robots.txt" > /dev/null
