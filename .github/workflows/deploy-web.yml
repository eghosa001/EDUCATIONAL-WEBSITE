name: Vercel deployment reference

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - name: Explain production deployment ownership
        run: |
          echo 'The canonical Next.js frontend is deployed by the Vercel Git integration.'
