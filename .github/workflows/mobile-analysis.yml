name: Mobile Analysis

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-analysis.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-analysis.yml'
  workflow_dispatch:

concurrency:
  group: mobile-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show Flutter version
        run: flutter --version
      - name: Install mobile dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze mobile app
        working-directory: mobile
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
