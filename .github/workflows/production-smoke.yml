name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WEB_URL: https://eghosa001.github.io/EDUCATIONAL-WEBSITE
      SUPABASE_URL: https://xanrzsszrysianxhpprk.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_-b8MMXYbJQKauBFjYVJ0vg_SG0GMpFs
    steps:
      - name: Smoke test GitHub Pages application
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl --fail --silent --show-error --retry 4 --retry-delay 5 --retry-all-errors "$WEB_URL/")"
          printf '%s' "$html" | grep -q 'THE GUIDE'
          curl --fail --silent --show-error --retry 4 --retry-delay 5 --retry-all-errors "$WEB_URL/app.js" | grep -q 'signInWithPassword'
          curl --fail --silent --show-error --retry 4 --retry-delay 5 --retry-all-errors "$WEB_URL/styles.css" | grep -q -- '--bg:'
          echo 'GitHub Pages application is reachable.'

      - name: Smoke test Supabase auth and curriculum API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-delay 5 --retry-all-errors "$SUPABASE_URL/auth/v1/health" > /dev/null
          response="$(curl --fail --silent --show-error --retry 4 --retry-delay 5 --retry-all-errors \
            "$SUPABASE_URL/rest/v1/topics?select=id&is_active=eq.true&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY")"
          printf '%s' "$response" | jq -e 'type == "array" and length >= 1' > /dev/null
          echo 'Supabase auth and curriculum API checks passed.'
