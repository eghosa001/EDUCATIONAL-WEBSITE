name: Extract Primary NERDC

on:
  push:
    branches: [main]
    paths-ignore:
      - 'generated/primary-nerdc/**'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/split-primary-nerdc.py
      - name: Commit extracted curriculum
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/primary-nerdc
          git diff --cached --quiet || git commit -m 'Generate split primary NERDC curriculum files'
          git push
