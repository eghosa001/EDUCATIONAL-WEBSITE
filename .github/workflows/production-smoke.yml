name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WEB_URL: https://web-ogs7.vercel.app
      BACKEND_URL: https://backend-ogs7.vercel.app
      SUPABASE_URL: https://xanrzsszrysianxhpprk.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_-b8MMXYbJQKauBFjYVJ0vg_SG0GMpFs
    steps:
      - name: Smoke test canonical Next.js application
        shell: bash
        run: |
          set -euo pipefail
          home="$(curl --fail --silent --show-error --retry 4 --retry-delay 5 --retry-all-errors "$WEB_URL/")"
          printf '%s' "$home" | grep -q 'THE GUIDE'
          printf '%s' "$home" | grep -q 'Study with structure'
          login="$(curl --fail --silent --show-error --retry 4 --retry-delay 5 --retry-all-errors "$WEB_URL/login")"
          printf '%s' "$login" | grep -q 'THE GUIDE'
          echo 'Canonical Vercel web application is reachable.'

      - name: Smoke test backend health
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --retry 4 --retry-delay 5 --retry-all-errors "$BACKEND_URL/health")"
          printf '%s' "$health" | jq -e '.success == true' > /dev/null
          echo 'Backend health check passed.'

      - name: Smoke test Supabase auth and curriculum API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-delay 5 --retry-all-errors "$SUPABASE_URL/auth/v1/health" > /dev/null
          response="$(curl --fail --silent --show-error --retry 4 --retry-delay 5 --retry-all-errors \
            "$SUPABASE_URL/rest/v1/topics?select=id&is_active=eq.true&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY")"
          printf '%s' "$response" | jq -e 'type == "array" and length >= 1' > /dev/null
          echo 'Supabase auth and curriculum API checks passed.'
