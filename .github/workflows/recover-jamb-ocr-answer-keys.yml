name: Recover JAMB OCR answer keys

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: recover-jamb-ocr-answer-keys
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install targeted PDF/OCR tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - name: Recover two-pass-consensus JAMB answer keys
        env:
          EXTRACTOR_URL: https://xanrzsszrysianxhpprk.supabase.co/functions/v1/past-question-extractor
          OIDC_AUDIENCE: the-guide-question-extractor
        run: python scripts/recover_jamb_ocr_answer_keys.py
