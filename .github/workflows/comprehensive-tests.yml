name: Comprehensive Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: comprehensive-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: read
  id-token: write

jobs:
  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://xanrzsszrysianxhpprk.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_-b8MMXYbJQKauBFjYVJ0vg_SG0GMpFs
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      TEST_ACCESS_TOKEN: ${{ secrets.TEST_ACCESS_TOKEN }}
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        working-directory: web
        run: npm install --workspaces=false --no-audit --no-fund --progress=false
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Typecheck web app
        working-directory: web
        run: npm run typecheck
      - name: Run web repository tests
        working-directory: web
        run: npm test
      - name: Build web app
        working-directory: web
        run: npm run build
      - name: Start web app
        working-directory: web
        run: |
          nohup npm run start > /tmp/the-guide-web.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/the-guide-web.log
          exit 1
      - name: Run comprehensive browser/API tests
        working-directory: web
        env:
          BASE_URL: http://127.0.0.1:3000
        run: npm run test:e2e
      - name: Run deployed Supabase Edge Function smoke tests
        working-directory: web
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          TEST_ACCESS_TOKEN: ${{ env.TEST_ACCESS_TOKEN }}
        run: npm run test:edge
      - name: Report missing optional authenticated integration secrets
        if: ${{ env.TEST_ACCESS_TOKEN == '' || env.TEST_EMAIL == '' || env.TEST_PASSWORD == '' }}
        run: |
          echo "::notice::Public deployed Edge Function smoke coverage is active. Authenticated integration coverage is reduced because optional test-account secrets are not configured."
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-artifacts
          path: web/test-results/
          if-no-files-found: ignore
      - name: Upload web server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-server-log
          path: /tmp/the-guide-web.log
          if-no-files-found: ignore

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --workspaces=false --no-audit --no-fund --progress=false
      - name: Lint backend
        working-directory: backend
        run: npm run lint
      - name: Run backend tests
        working-directory: backend
        env:
          NODE_ENV: test
          PGHOST: 127.0.0.1
          PGPORT: 59999
          PGUSER: test
          PGPASSWORD: test
          PGDATABASE: test
        run: npm test

  admin-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install admin dependencies
        working-directory: admin
        run: npm install --workspaces=false --no-audit --no-fund --progress=false
      - name: Typecheck admin app
        working-directory: admin
        run: npm run typecheck
      - name: Run admin repository tests
        working-directory: admin
        run: npm test
      - name: Build admin app
        working-directory: admin
        run: npm run build

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://xanrzsszrysianxhpprk.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_-b8MMXYbJQKauBFjYVJ0vg_SG0GMpFs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Wait for Vercel production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in {1..60}; do
            payload=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status")
            state=$(node -e 'const d=JSON.parse(process.argv[1]); const s=(d.statuses||[]).find(x=>String(x.context||"").includes("Vercel")&&String(x.context||"").endsWith("web")); console.log(s?.state||"pending")' "$payload")
            echo "Vercel web status: $state"
            if [ "$state" = "success" ]; then exit 0; fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then exit 1; fi
            sleep 10
          done
          echo "Timed out waiting for the Vercel web deployment"
          exit 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        working-directory: web
        run: npm install --workspaces=false --no-audit --no-fund --progress=false
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Create temporary production QA student
        shell: bash
        run: |
          set -euo pipefail
          oidc_json=$(curl --fail-with-body -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=the-guide-production-qa")
          oidc_token=$(node -e 'const d=JSON.parse(process.argv[1]); if(!d.value) process.exit(1); process.stdout.write(d.value)' "$oidc_json")
          qa_json=$(curl --fail-with-body -sS -X POST "${NEXT_PUBLIC_SUPABASE_URL}/functions/v1/qa-user" \
            -H "Authorization: Bearer $oidc_token" \
            -H "apikey: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"action":"create"}')
          QA_USER_ID=$(node -e 'const d=JSON.parse(process.argv[1]); if(!d.userId) process.exit(1); process.stdout.write(d.userId)' "$qa_json")
          QA_EMAIL=$(node -e 'const d=JSON.parse(process.argv[1]); if(!d.email) process.exit(1); process.stdout.write(d.email)' "$qa_json")
          QA_PASSWORD=$(node -e 'const d=JSON.parse(process.argv[1]); if(!d.password) process.exit(1); process.stdout.write(d.password)' "$qa_json")
          echo "::add-mask::$QA_EMAIL"
          echo "::add-mask::$QA_PASSWORD"
          echo "QA_USER_ID=$QA_USER_ID" >> "$GITHUB_ENV"
          echo "QA_EMAIL=$QA_EMAIL" >> "$GITHUB_ENV"
          echo "QA_PASSWORD=$QA_PASSWORD" >> "$GITHUB_ENV"
      - name: Run authenticated Playwright against deployed production
        working-directory: web
        env:
          BASE_URL: https://web-ogs7.vercel.app
          PRODUCTION_SMOKE: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          QA_EMAIL: ${{ env.QA_EMAIL }}
          QA_PASSWORD: ${{ env.QA_PASSWORD }}
        run: npx playwright test e2e/production-deployed.spec.mjs --workers=1
      - name: Delete temporary production QA student
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QA_USER_ID:-}" ]; then
            echo "No temporary QA user was created."
            exit 0
          fi
          oidc_json=$(curl --fail-with-body -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=the-guide-production-qa")
          oidc_token=$(node -e 'const d=JSON.parse(process.argv[1]); if(!d.value) process.exit(1); process.stdout.write(d.value)' "$oidc_json")
          curl --fail-with-body -sS -X POST "${NEXT_PUBLIC_SUPABASE_URL}/functions/v1/qa-user" \
            -H "Authorization: Bearer $oidc_token" \
            -H "apikey: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}" \
            -H "Content-Type: application/json" \
            --data "{"action":"delete","userId":"$QA_USER_ID"}"
      - name: Upload production Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
