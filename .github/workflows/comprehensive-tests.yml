name: Comprehensive Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Never cancel a test run just because another commit was pushed.
# A full run should finish so its result is useful for diagnosis.
concurrency:
  group: comprehensive-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package.json

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund --progress=false

      - name: Install Chromium
        working-directory: web
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Typecheck web app
        working-directory: web
        run: npm run typecheck

      - name: Run unit tests
        working-directory: web
        run: npm test

      - name: Build web app
        working-directory: web
        run: npm run build

      - name: Start web app
        working-directory: web
        run: |
          nohup npm run start > /tmp/the-guide-web.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/the-guide-web.log
          exit 1

      - name: Run comprehensive browser/API tests
        working-directory: web
        env:
          BASE_URL: http://127.0.0.1:3000
        run: npm run test:e2e

      - name: Run Supabase Edge Function smoke tests
        if: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_ANON_KEY != '' }}
        working-directory: web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TEST_ACCESS_TOKEN: ${{ secrets.TEST_ACCESS_TOKEN }}
        run: npm run test:edge

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-artifacts
          path: web/test-results/
          if-no-files-found: ignore

      - name: Upload web server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-server-log
          path: /tmp/the-guide-web.log
          if-no-files-found: ignore
