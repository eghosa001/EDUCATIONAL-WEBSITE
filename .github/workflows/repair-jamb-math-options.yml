name: Repair JAMB Maths MCQ options

on:
  push:
    branches: [main]
    paths:
      - scripts/repair_jamb_math_mcq_options.py
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: repair-jamb-math-mcq-options
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install targeted PDF/OCR tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - name: Recover JAMB Mathematics MCQ options by two-pass consensus
        env:
          EXTRACTOR_URL: https://xanrzsszrysianxhpprk.supabase.co/functions/v1/past-question-extractor
          OIDC_AUDIENCE: the-guide-question-extractor
        run: python scripts/repair_jamb_math_mcq_options.py
