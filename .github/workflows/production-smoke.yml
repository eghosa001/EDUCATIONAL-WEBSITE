name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WEB_URL: https://web-ogs7.vercel.app
      API_URL: https://backend-ogs7.vercel.app/api/v1
    steps:
      - name: Smoke test website
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-delay 5 --retry-all-errors "$WEB_URL/" > /dev/null
          curl --fail --silent --show-error --retry 4 --retry-delay 5 --retry-all-errors "$WEB_URL/robots.txt" | grep -qi 'user-agent'
          curl --fail --silent --show-error --retry 4 --retry-delay 5 --retry-all-errors "$WEB_URL/sitemap.xml" | grep -qi '<urlset'

      - name: Smoke test production API and database health
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 4 --retry-delay 5 --retry-all-errors "$API_URL/health")"
          printf '%s' "$response" | jq -e '.success == true' > /dev/null
          echo 'Production API health check passed.'
