name: educational_platform_mobile
description: "THE GUIDE Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core
  flutter_riverpod: ^2.4.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0
  equatable: ^2.0.5
  dartz: ^0.10.1

  # Networking
  dio: ^5.3.0
  retrofit: ^4.0.0
  pretty_dio_logger: ^1.3.0

  # Storage
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0

  # Routing
  go_router: ^12.0.0

  # DI
  get_it: ^7.6.0
  injectable: ^2.3.0

  # Utils
  intl: ^0.18.0
  uuid: ^4.2.0
  path: ^1.8.0
  url_launcher: ^6.2.0
  share_plus: ^7.2.0
  package_info_plus: ^4.2.0
  device_info_plus: ^9.1.0
  connectivity_plus: ^5.0.0
  permission_handler: ^11.0.0

  # UI
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.0
  lottie: ^2.7.0
  flutter_animate: ^4.2.0

  # Forms & Validation
  formz: ^0.7.0
  auto_size_text: ^3.0.0

  # Charts
  fl_chart: ^0.65.0

  # PDF & Documents
  pdfx: ^2.6.0
  pdf: ^3.10.0
  printing: ^5.11.0

  # Video Player
  video_player: ^2.8.0
  chewie: ^1.7.0

  # Notifications
  firebase_messaging: ^14.7.0
  flutter_local_notifications: ^16.0.0

  # Analytics
  firebase_analytics: ^10.7.0
  firebase_crashlytics: ^3.4.0

  # AI Chat
  markdown_widget: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  retrofit_generator: ^8.0.0
  injectable_generator: ^2.4.0
  hive_generator: ^2.0.0
  very_good_analysis: ^5.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/logos/
    - assets/icons/
    - assets/animations/
    - assets/fonts/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700