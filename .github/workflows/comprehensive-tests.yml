name: Comprehensive Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: comprehensive-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://xanrzsszrysianxhpprk.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_-b8MMXYbJQKauBFjYVJ0vg_SG0GMpFs
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      TEST_ACCESS_TOKEN: ${{ secrets.TEST_ACCESS_TOKEN }}
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        working-directory: web
        run: npm install --workspaces=false --no-audit --no-fund --progress=false
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Typecheck web app
        working-directory: web
        run: npm run typecheck
      - name: Run web repository tests
        working-directory: web
        run: npm test
      - name: Build web app
        working-directory: web
        run: npm run build
      - name: Start web app
        working-directory: web
        run: |
          nohup npm run start > /tmp/the-guide-web.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/the-guide-web.log
          exit 1
      - name: Run comprehensive browser/API tests
        working-directory: web
        env:
          BASE_URL: http://127.0.0.1:3000
        run: npm run test:e2e
      - name: Run deployed Supabase Edge Function smoke tests
        working-directory: web
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          TEST_ACCESS_TOKEN: ${{ env.TEST_ACCESS_TOKEN }}
        run: npm run test:edge
      - name: Report missing optional authenticated integration secrets
        if: ${{ env.TEST_ACCESS_TOKEN == '' || env.TEST_EMAIL == '' || env.TEST_PASSWORD == '' }}
        run: |
          echo "::notice::Public deployed Edge Function smoke coverage is active. Authenticated integration coverage is reduced because optional test-account secrets are not configured."
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-artifacts
          path: web/test-results/
          if-no-files-found: ignore
      - name: Upload web server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-server-log
          path: /tmp/the-guide-web.log
          if-no-files-found: ignore

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --workspaces=false --no-audit --no-fund --progress=false
      - name: Lint backend
        working-directory: backend
        run: npm run lint
      - name: Run backend tests
        working-directory: backend
        env:
          NODE_ENV: test
          PGHOST: 127.0.0.1
          PGPORT: 59999
          PGUSER: test
          PGPASSWORD: test
          PGDATABASE: test
        run: npm test

  admin-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install admin dependencies
        working-directory: admin
        run: npm install --workspaces=false --no-audit --no-fund --progress=false
      - name: Typecheck admin app
        working-directory: admin
        run: npm run typecheck
      - name: Run admin repository tests
        working-directory: admin
        run: npm test
      - name: Build admin app
        working-directory: admin
        run: npm run build
